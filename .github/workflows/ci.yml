name: macOS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          base = os.environ.get("BASE_SHA", "")
          code = True
          if os.environ["EVENT_NAME"] != "workflow_dispatch" and base and set(base) != {"0"}:
              result = subprocess.run(["git", "diff", "--no-renames", "--name-only", "-z", base, "HEAD"], capture_output=True, check=True)
              paths = [p for p in result.stdout.decode().split("\0") if p]
              code = not paths or any(not p.endswith(".md") for p in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"code={str(code).lower()}\n")
          PYCODE
  test:
    needs: changes
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-15
    steps:
      - name: Require successful path classification
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: swift build
      - run: swift test
      - run: swift build -c release
